<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0}body{width:1500px;height:500px;overflow:hidden;font:20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.b{position:relative;width:1500px;height:500px;padding:0 90px;display:grid;grid-template-columns:1fr 540px;gap:60px;align-items:center}
.dark{background:#161514;color:#F5F3EC}.light{background:#F5F3EC;color:#161514}
h1{font:400 50px/1.16 "Libre Baskerville",Georgia,serif;letter-spacing:-.015em;margin-top:-90px}
h1 span{opacity:.55}
.brand{position:absolute;left:90px;top:56px;display:flex;align-items:center;gap:12px;font:600 26px -apple-system,sans-serif;opacity:.9}
.brand svg{width:40px}
.url{position:absolute;right:90px;bottom:46px;font:500 18px -apple-system,sans-serif;opacity:.6}
.panel{border-radius:22px;padding:22px 24px;display:grid;gap:10px}
.dark .panel{background:#1f1e1c;border:1px solid rgba(245,243,236,.1)}.light .panel{background:#FCFBF7;border:1px solid #DDD8CC;box-shadow:0 20px 50px -30px rgba(22,21,20,.3)}
.ph{display:flex;align-items:center;gap:10px;font:500 15px -apple-system,sans-serif;opacity:.7;margin-bottom:4px}
.ph i{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,.15)}
.row{display:grid;grid-template-columns:120px 110px 70px 1fr;gap:12px;align-items:center;font-size:17px;padding:8px 0;border-top:1px solid rgba(128,128,128,.18)}
.row b{font-weight:600}.m{font:15px ui-monospace,Menlo,monospace;opacity:.6}
.ok,.held{font:600 13px -apple-system,sans-serif;padding:4px 10px;border-radius:999px;justify-self:end;white-space:nowrap}
.ok{background:rgba(74,222,128,.14);color:#2f9a58}.dark .ok{color:#7fd9a0}.held{background:rgba(220,80,60,.13);color:#c8432f}.dark .held{color:#f0998a}</style></head><body>
