<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ===== visuals: small animated pictures instead of paragraphs (they inherit the design's colour) ===== */
.viz{position:relative;width:100%;aspect-ratio:1.5;color:inherit}
.viz svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.viz .s{stroke:currentColor;fill:none;stroke-width:1.5;vector-effect:non-scaling-stroke}
.viz .f{fill:currentColor}
.viz .o2{opacity:.22}.viz .o4{opacity:.45}
/* scanner: a document read by a moving beam */
.v-scan .beam{animation:vbeam 2.6s cubic-bezier(.6,0,.4,1) infinite}
@keyframes vbeam{0%{transform:translateY(0)}50%{transform:translateY(118px)}100%{transform:translateY(0)}}
.v-scan .ck{opacity:0;animation:vck 2.6s infinite}.v-scan .ck:nth-of-type(2){animation-delay:.35s}.v-scan .ck:nth-of-type(3){animation-delay:.7s}
@keyframes vck{30%,80%{opacity:1}0%,20%,100%{opacity:0}}
/* radar: rings, a sweep and real launches as blips */
.v-radar .sweep{position:absolute;left:50%;top:50%;width:84%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(from 0deg,currentColor 0deg,transparent 70deg);opacity:.22;animation:vspin 3.2s linear infinite;-webkit-mask:radial-gradient(circle,#000 69%,transparent 70%);mask:radial-gradient(circle,#000 69%,transparent 70%)}
@keyframes vspin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.v-radar .blip{position:absolute;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:currentColor;animation:vblip 3.2s infinite}
.v-radar .blip.bad{background:#ef4444}
@keyframes vblip{0%,100%{opacity:.25;transform:scale(.8)}10%{opacity:1;transform:scale(1.4)}}
/* sniper: a reticle that locks */
.v-snipe .ret{transform-origin:150px 100px;animation:vlock 2.8s cubic-bezier(.6,0,.2,1) infinite}
@keyframes vlock{0%{transform:translate(-46px,24px) scale(1.25)}45%,85%{transform:none}100%{transform:translate(-46px,24px) scale(1.25)}}
.v-snipe .hit{transform-origin:150px 100px;animation:vhit 2.8s infinite}
@keyframes vhit{0%,44%{opacity:0;transform:scale(.4)}55%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0}}
/* fee claimer: many accounts flow into one wallet */
.v-fees .flow{stroke-dasharray:4 7;animation:vflow 1.2s linear infinite}
@keyframes vflow{to{stroke-dashoffset:-22}}
.v-fees .acc{animation:vpulse 2.4s infinite}
@keyframes vpulse{50%{opacity:.35}}
/* launchpad: a bonding curve fills to graduation */
.v-launch .curve{stroke-dasharray:320;stroke-dashoffset:320;animation:vdraw 3.4s cubic-bezier(.5,0,.3,1) infinite}
@keyframes vdraw{0%{stroke-dashoffset:320}60%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.v-launch .grad{transform-origin:244px 38px;animation:vgrad 3.4s infinite}
@keyframes vgrad{0%,55%{transform:scale(0)}65%,90%{transform:scale(1)}100%{transform:scale(1);opacity:0}}
/* launch kit: lines being written */
.v-kit .ln{transform-origin:left;animation:vtype 3s steps(14) infinite}
.v-kit .ln:nth-of-type(2){animation-delay:.4s}.v-kit .ln:nth-of-type(3){animation-delay:.8s}.v-kit .ln:nth-of-type(4){animation-delay:1.2s}
@keyframes vtype{0%{transform:scaleX(0)}40%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
/* agent studio: a conversation */
.v-agent .b1{animation:vb 4s infinite}.v-agent .b2{animation:vb 4s 1.2s infinite}.v-agent .b3{animation:vb 4s 2.2s infinite}
@keyframes vb{0%,10%{opacity:0;transform:translateY(6px)}20%,85%{opacity:1;transform:none}100%{opacity:0}}
.v-agent .td{animation:vdot 1s infinite}.v-agent .td:nth-of-type(2){animation-delay:.15s}.v-agent .td:nth-of-type(3){animation-delay:.3s}
@keyframes vdot{50%{opacity:.2}}
/* AI picks: a score ring */
.v-pick .ring{stroke-dasharray:283;stroke-dashoffset:283;animation:vscore 3s cubic-bezier(.5,0,.2,1) infinite;transform:rotate(-90deg);transform-origin:150px 100px}
@keyframes vscore{0%{stroke-dashoffset:283}50%,90%{stroke-dashoffset:62}100%{stroke-dashoffset:62;opacity:0}}
/* directives */
.v-key .cross{stroke-dasharray:130;stroke-dashoffset:130;animation:vdraw2 3s infinite}
@keyframes vdraw2{0%,20%{stroke-dashoffset:130}50%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
.v-clamp .val{animation:vclamp 2.6s cubic-bezier(.5,0,.3,1) infinite}
@keyframes vclamp{0%{transform:translateX(-70px)}40%{transform:translateX(110px)}55%,85%{transform:translateX(64px)}100%{transform:translateX(-70px)}}
.v-trace .tx{stroke-dasharray:6 6;animation:vflow 1s linear infinite}
.v-trace .node{animation:vpulse 2s infinite}.v-trace .node:nth-of-type(2){animation-delay:.3s}.v-trace .node:nth-of-type(3){animation-delay:.6s}
@media (prefers-reduced-motion:reduce){.viz *{animation:none!important}}

:root{--ink:#161514;--paper:#F5F3EC;--surface:#FCFBF7;--sunk:#EBE8DF;--line:#DDD8CC;--ink2:#45423C;--mute:#86827A;--ok:#2F7A4A;--high:#C8432F;
  --serif:"Libre Baskerville",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0}
html,body{width:1600px;height:900px;overflow:hidden;background:var(--paper);color:var(--ink);font:24px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body.dark{background:var(--ink);color:var(--paper)}
.stage{position:absolute;inset:0;padding:84px 110px;display:flex;flex-direction:column}
.foot{position:absolute;left:110px;right:110px;bottom:54px;display:flex;justify-content:space-between;align-items:center;font:500 20px var(--sans);color:var(--mute)}
.brand{display:flex;align-items:center;gap:12px;font:600 26px var(--sans);color:var(--ink)}
body.dark .brand{color:var(--paper)}
.brand svg{width:40px;height:auto}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
h1{font:400 84px/1.12 var(--serif);letter-spacing:-.02em}
h2{font:400 60px/1.16 var(--serif);letter-spacing:-.015em}
.sub{color:var(--ink2);font-size:28px;margin-top:22px;max-width:30ch}
body.dark .sub{color:#b9b4aa}
.mark{color:currentColor}
.center{align-items:center;justify-content:center;text-align:center}
.split{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;flex:1}
/* chat */
.chat{width:1100px;margin:0 auto;display:grid;gap:26px}
.bub{justify-self:end;background:var(--sunk);border-radius:26px 26px 6px 26px;padding:16px 24px;font-size:27px;white-space:nowrap}
.ans{display:grid;grid-template-columns:52px 1fr;gap:20px;align-items:start;font-size:27px;line-height:1.5}
.av{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.av svg{width:30px;height:auto}
.box{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:22px 26px 18px 30px;box-shadow:0 18px 50px -30px rgba(22,21,20,.35);display:flex;justify-content:space-between;align-items:flex-end;gap:20px;font-size:26px;color:var(--mute)}
.box .go{width:52px;height:52px;border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none}
.box .go svg{width:24px;height:24px}
.tok{font-weight:600;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--line);font:500 21px var(--sans);color:var(--ink2);margin:0 6px}
/* report */
.rep{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:28px 32px;display:grid;gap:16px;font-size:24px}
.rep .hd b{font:600 30px var(--sans)}.rep .hd span{display:block;color:var(--mute);font:20px var(--mono);margin-top:2px}
.rep li{list-style:none;display:grid;grid-template-columns:16px 1fr;gap:14px;align-items:baseline}
.rep li i{width:12px;height:12px;border-radius:50%;background:var(--mute)}
.rep li.ok i{background:var(--ok)}.rep li.high i{background:var(--high)}
.rep ul{padding:0;display:grid;gap:12px}
/* terminal */
.term{background:var(--ink);color:var(--paper);border-radius:30px;padding:36px 40px;font:24px/1.6 var(--mono);display:grid;gap:14px}
.term .k{color:#9d988e}.term .g{color:#9fd3a8}.term .r{color:#e9a08f}
/* rows */
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:200px 1fr 140px 170px;align-items:center;gap:20px;padding:16px 26px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:24px}
.row b{font-weight:600}.row .m{color:var(--mute);font:22px var(--mono)}
.tag{justify-self:end;font:600 19px var(--sans);padding:6px 16px;border-radius:999px}
.tag.ok{background:rgba(47,122,74,.12);color:var(--ok)}.tag.held{background:rgba(200,67,47,.1);color:var(--high)}
.big{font:400 230px/1 var(--serif);letter-spacing:-.04em}
#n{font-size:170px}
.steps{display:grid;gap:18px}
.step{display:grid;grid-template-columns:60px 1fr;gap:22px;align-items:center;font-size:28px}
.step .n{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 22px var(--sans)}
.step.on .n{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.step span{color:var(--mute);display:block;font-size:22px}
.viz{color:currentColor}
.vbig{width:560px}
.grid7{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:46px}
.tool{border:1px solid var(--line);border-radius:24px;padding:22px 24px;background:var(--surface);font:600 25px var(--sans);display:grid;gap:8px}
.tool .viz{height:120px;aspect-ratio:auto}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:26px;margin-top:70px}
.flow .viz{height:150px;aspect-ratio:auto;margin-top:10px}
.flow div{display:grid;gap:14px}
.flow b{font:400 40px var(--serif)}.flow span{color:var(--ink2);font-size:21px}
.flow .d{width:62px;height:62px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:600 24px var(--sans)}
.fade{opacity:0}
/* stills: drawn pictures shown complete */
body.still .v-launch .curve{animation:none;stroke-dasharray:none;stroke-dashoffset:0}
body.still .v-launch .grad{animation:none;transform:none}
.score{width:420px;height:420px}
.reads{list-style:none;padding:0;margin:44px 0 0;display:grid;gap:16px;font-size:30px}
.reads li{display:grid;grid-template-columns:22px 1fr;gap:18px;align-items:center}
.reads li i{width:12px;height:12px;border-radius:50%;background:#e9a08f}
.stamp{margin-top:44px;justify-self:start;align-self:flex-start;font:600 26px var(--sans);padding:12px 26px;border-radius:999px;background:rgba(233,160,143,.14);color:#e9a08f;border:1px solid rgba(233,160,143,.35)}
.gauge{position:relative;width:520px;height:520px}.gauge svg{width:100%;height:100%}
.gauge>div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.gauge b{font:400 150px/1 var(--serif);letter-spacing:-.03em}.gauge span{font:600 20px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-top:10px}
.why{margin:40px 0 0;padding:0;list-style:none;display:grid;gap:14px;font-size:26px}
.why li{padding:14px 22px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.lanes{display:grid;gap:26px;margin-top:50px}
.lane{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 30px}
.lh{display:flex;justify-content:space-between;align-items:center;font-size:28px}
.track{position:relative;height:46px;margin:46px 0 10px;border-bottom:2px solid var(--line)}
.track i{position:absolute;bottom:8px;width:14px;height:14px;border-radius:50%;background:var(--ink);transform:translateX(-50%);transition:opacity .2s}
.track em{position:absolute;top:-4px;bottom:-6px;border-left:2px dashed var(--mute);opacity:.6}
.lane p{color:var(--ink2);font-size:23px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:56px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:34px 38px;display:grid;gap:14px;justify-items:start}
.card b{font:400 44px/1.15 var(--serif)}.card p{color:var(--ink2);font-size:25px}
.card .tag{justify-self:start}
.bag{width:100%;height:18px;border-radius:999px;background:var(--sunk);overflow:hidden;margin-top:10px}.bag span{display:block;height:100%;background:var(--ok)}
.card small{font:500 19px var(--mono);color:var(--mute)}
.card.bad small{color:var(--high)}
.web{width:640px;height:640px;justify-self:center}
.web line{stroke:var(--line);stroke-width:2}.web circle{fill:var(--high);opacity:.85}
.web .dev{fill:var(--ink);opacity:1}.web text{fill:var(--paper);font:600 20px var(--sans);text-anchor:middle}
.xcard{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:36px 40px;display:grid;gap:30px}
.xh{display:flex;gap:20px;align-items:center}.xh b{font:600 30px var(--sans);display:block}.xh span{color:var(--mute);font-size:21px}
.xa{width:72px;height:72px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:34px}
.xn{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.xn b{display:block;font:400 72px/1 var(--serif)}.xn span{color:var(--mute);font-size:21px}
.xv{font-size:24px;color:var(--high);border-top:1px solid var(--line);padding-top:22px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:50px}
.trio b{display:block;font:400 190px/1 var(--serif);letter-spacing:-.04em;color:#8d887e}.trio .on b{color:var(--paper)}
.trio span{font-size:26px;color:#b9b4aa}
.handle{margin-top:20px;font:500 34px var(--mono);padding:18px 40px;border:1px solid rgba(245,243,236,.25);border-radius:999px}
.track em small{position:absolute;top:-30px;left:8px;font:500 17px var(--mono);color:var(--mute);white-space:nowrap}
.track u{position:absolute;right:0;top:-30px;text-decoration:none;font:500 17px var(--mono);color:var(--mute)}
.livechip{display:inline-flex;align-items:center;gap:14px;font:500 22px var(--sans);padding:12px 26px;border-radius:999px;border:1px solid rgba(245,243,236,.22);color:#d9d4c9}
.livechip i{width:12px;height:12px;border-radius:50%;background:#4ade80;box-shadow:0 0 14px #4ade80}
.unl{display:grid;grid-template-columns:repeat(3,auto);gap:80px;margin-top:40px;padding-top:36px;border-top:1px solid rgba(245,243,236,.14)}
.unl b{display:block;font:400 56px/1 var(--serif)}.unl span{font-size:20px;color:#8d887e}
.nhead{display:flex;justify-content:space-between;align-items:center}
.livechip.lt{border-color:var(--line);color:var(--ink2);font-size:20px;padding:10px 22px}.livechip.lt i{background:#2F7A4A;box-shadow:none}
.nca{font:500 20px var(--mono);color:var(--mute)}
.ntiles{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:40px}
.ntiles div{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 24px}
.ntiles b{display:block;font:400 54px/1 var(--serif);letter-spacing:-.02em}.ntiles span{display:block;margin-top:10px;font-size:19px;color:var(--mute);line-height:1.3}
.nnew{margin-top:34px;display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
.lbl2{font:600 15px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding-top:6px}
.nnew ul{list-style:none;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px 40px;font-size:21px;color:var(--ink2)}
.nnew li b{color:var(--ink);font-weight:600}
</style></head>
<body>
<div id="root"></div>
<script>
const MARK = '<svg class="mark" viewBox="40 68 176 118"><path d="M44 156A84 84 0 0 1 212 156H182A54 54 0 0 0 74 156Z" fill="currentColor"/><path d="M102 156A26 26 0 1 0 154 156A26 26 0 1 0 102 156Z" fill="currentColor"/></svg>';
