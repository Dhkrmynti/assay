<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>

:root{--ink:#161514;--paper:#F5F3EC;--surface:#FCFBF7;--sunk:#EBE8DF;--line:#DDD8CC;--ink2:#45423C;--mute:#86827A;--ok:#2F7A4A;--high:#C8432F;
  --serif:"Libre Baskerville",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0}
html,body{width:1600px;height:900px;overflow:hidden;background:var(--paper);color:var(--ink);font:24px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body.dark{background:var(--ink);color:var(--paper)}
.stage{position:absolute;inset:0;padding:84px 110px;display:flex;flex-direction:column}
.foot{position:absolute;left:110px;right:110px;bottom:54px;display:flex;justify-content:space-between;align-items:center;font:500 20px var(--sans);color:var(--mute)}
.brand{display:flex;align-items:center;gap:12px;font:600 26px var(--sans);color:var(--ink)}
body.dark .brand{color:var(--paper)}
.brand svg{width:40px;height:auto}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
h1{font:400 84px/1.12 var(--serif);letter-spacing:-.02em}
h2{font:400 60px/1.16 var(--serif);letter-spacing:-.015em}
.sub{color:var(--ink2);font-size:28px;margin-top:22px;max-width:30ch}
body.dark .sub{color:#b9b4aa}
.mark{color:currentColor}
.center{align-items:center;justify-content:center;text-align:center}
.split{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;flex:1}
/* chat */
.chat{width:1100px;margin:0 auto;display:grid;gap:26px}
.bub{justify-self:end;background:var(--sunk);border-radius:26px 26px 6px 26px;padding:16px 24px;font-size:27px;white-space:nowrap}
.ans{display:grid;grid-template-columns:52px 1fr;gap:20px;align-items:start;font-size:27px;line-height:1.5}
.av{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.av svg{width:30px;height:auto}
.box{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:22px 26px 18px 30px;box-shadow:0 18px 50px -30px rgba(22,21,20,.35);display:flex;justify-content:space-between;align-items:flex-end;gap:20px;font-size:26px;color:var(--mute)}
.box .go{width:52px;height:52px;border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none}
.box .go svg{width:24px;height:24px}
.tok{font-weight:600;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--line);font:500 21px var(--sans);color:var(--ink2);margin:0 6px}
/* report */
.rep{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:28px 32px;display:grid;gap:16px;font-size:24px}
.rep .hd b{font:600 30px var(--sans)}.rep .hd span{display:block;color:var(--mute);font:20px var(--mono);margin-top:2px}
.rep li{list-style:none;display:grid;grid-template-columns:16px 1fr;gap:14px;align-items:baseline}
.rep li i{width:12px;height:12px;border-radius:50%;background:var(--mute)}
.rep li.ok i{background:var(--ok)}.rep li.high i{background:var(--high)}
.rep ul{padding:0;display:grid;gap:12px}
/* terminal */
.term{background:var(--ink);color:var(--paper);border-radius:30px;padding:36px 40px;font:24px/1.6 var(--mono);display:grid;gap:14px}
.term .k{color:#9d988e}.term .g{color:#9fd3a8}.term .r{color:#e9a08f}
/* rows */
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:200px 1fr 140px 170px;align-items:center;gap:20px;padding:16px 26px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:24px}
.row b{font-weight:600}.row .m{color:var(--mute);font:22px var(--mono)}
.tag{justify-self:end;font:600 19px var(--sans);padding:6px 16px;border-radius:999px}
.tag.ok{background:rgba(47,122,74,.12);color:var(--ok)}.tag.held{background:rgba(200,67,47,.1);color:var(--high)}
.big{font:400 230px/1 var(--serif);letter-spacing:-.04em}
#n{font-size:170px}
.steps{display:grid;gap:18px}
.step{display:grid;grid-template-columns:60px 1fr;gap:22px;align-items:center;font-size:28px}
.step .n{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 22px var(--sans)}
.step.on .n{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.step span{color:var(--mute);display:block;font-size:22px}
.viz{color:currentColor}
.vbig{width:560px}
.grid7{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:46px}
.tool{border:1px solid var(--line);border-radius:24px;padding:22px 24px;background:var(--surface);font:600 25px var(--sans);display:grid;gap:8px}
.tool .viz{height:120px;aspect-ratio:auto}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:26px;margin-top:70px}
.flow .viz{height:150px;aspect-ratio:auto;margin-top:10px}
.flow div{display:grid;gap:14px}
.flow b{font:400 40px var(--serif)}.flow span{color:var(--ink2);font-size:21px}
.flow .d{width:62px;height:62px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:600 24px var(--sans)}
.fade{opacity:0}
/* stills: drawn pictures shown complete */
body.still .v-launch .curve{animation:none;stroke-dasharray:none;stroke-dashoffset:0}
body.still .v-launch .grad{animation:none;transform:none}
.score{width:420px;height:420px}
.nhead{display:flex;justify-content:space-between;align-items:center}
.chipx{display:inline-flex;align-items:center;gap:12px;font:500 20px var(--sans);padding:10px 22px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
.chipx i{width:11px;height:11px;border-radius:50%;background:#2F7A4A}
body.dark .chipx{border-color:rgba(245,243,236,.22);color:#d9d4c9}body.dark .chipx i{background:#4ade80}
.nca{font:500 20px var(--mono);color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}
.tiles div{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 26px}
.tiles b{display:block;font:400 58px/1 var(--serif);letter-spacing:-.02em}.tiles span{display:block;margin-top:10px;font-size:19px;color:var(--mute)}
.bar{margin-top:30px}.bt{display:flex;justify-content:space-between;font-size:20px;color:var(--ink2)}
.track2{height:16px;border-radius:999px;background:var(--sunk);margin-top:12px;overflow:hidden}.track2 i{display:block;height:100%;width:0;background:var(--ink);border-radius:999px}
.segs{display:flex;gap:6px;height:30px;margin-top:22px}.segs i{border-radius:8px;transform-origin:left;transform:scaleX(0)}
.segs .rug,.legend .rug{background:#e9a08f}.segs .slow,.legend .slow{background:#6b6760}.segs .other,.legend .other{background:#b9b4aa}.segs .ok,.legend .ok{background:#4ade80}
.legend{display:grid;grid-template-columns:repeat(2,auto);justify-content:start;gap:14px 70px;margin-top:28px;font-size:26px;color:#d9d4c9}
.legend div{display:flex;align-items:center;gap:14px}.legend i{width:16px;height:16px;border-radius:5px}.legend b{font:400 40px var(--serif);color:var(--paper)}
.reads{list-style:none;padding:0;margin:44px 0 0;display:grid;gap:16px;font-size:30px}
.reads li{display:grid;grid-template-columns:22px 1fr;gap:18px;align-items:center}.reads li i{width:12px;height:12px;border-radius:50%;background:#e9a08f}
.stamp{margin-top:44px;align-self:flex-start;font:600 26px var(--sans);padding:12px 26px;border-radius:999px;background:rgba(233,160,143,.14);color:#e9a08f;border:1px solid rgba(233,160,143,.35)}
.ticks{list-style:none;padding:0;display:grid;gap:14px}
.ticks li{display:grid;grid-template-columns:40px 1fr;gap:16px;align-items:center;padding:16px 22px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:24px}
.ticks li i{width:34px;height:34px;border-radius:50%;background:rgba(47,122,74,.14);color:var(--ok);display:grid;place-items:center;font-style:normal;font-weight:700}
.note2{margin-top:26px;font-size:19px;color:var(--mute)}
</style></head>
<body>
<div id="root"></div>
<script>
const MARK = '<svg class="mark" viewBox="40 68 176 118"><path d="M44 156A84 84 0 0 1 212 156H182A54 54 0 0 0 74 156Z" fill="currentColor"/><path d="M102 156A26 26 0 1 0 154 156A26 26 0 1 0 102 156Z" fill="currentColor"/></svg>';
const VIZ = {};
const D = {"when": "24 Oct 2026 \u00b7 19:02 WIB", "oc": {"ca": "0xDDEC469bd035fB42Db868367D50E059Afdd53892", "tiles": [{"v": 48, "label": "holders"}, {"v": 65, "label": "unique buyers"}, {"v": 0.9004226190064945, "d": 2, "suf": " ETH", "label": "on the curve"}, {"v": 0, "d": 0, "suf": "%", "label": "sold by the dev"}, {"v": 0, "label": "bundled wallets"}, {"v": 20.6901, "d": 1, "suf": "%", "label": "held by the top 10"}, {"v": 13, "suf": "/100", "label": "rug risk"}, {"v": 4895176.439658139, "label": "$OCULA burned"}], "progress": 21.4, "curveETH": "0.90", "gradETH": "4.2"}, "radar": {"total": 1335, "n": 24, "segs": [{"k": "rug", "v": 18, "label": "dev already sold everything"}, {"k": "slow", "v": 4, "label": "not growing"}, {"k": "ok", "v": 2, "label": "cleared every check"}]}, "trap": {"symbol": "OMF", "age": "7 min", "buyers": 30, "lines": ["The dev sold the whole bag: 54.10% out, 0% left", "26 bundled wallets bought 11.6%, now hold 0.0%", "28 of 30 buyers already sold"], "verdict": "Held \u00b7 rug risk 65/100"}, "pick": {"symbol": "SCOTIA", "age": "10 min", "line": "Growing: 57 new buyers in the last 15 min.", "checks": ["Dev has not sold", "Dev holds 0.86%", "Creator tax 1.2%", "Socials: twitter", "No other launch by this dev in 24h", "Fees go to the dev", "Growing: 57 new buyers in the last 15 min"]}, "burn": {"tokens": "4,895,176", "line": "$50 of buybacks so far \u00b7 last tx 0x9ebe6d3b\u2026"}};
const nf = (n) => Number(n).toLocaleString("en-US");
const brand = `<div class="brand">${MARK}ocula</div>`;
const foot = (dark) => `<div class="foot"><div class="brand">${MARK}ocula</div><span>oculaagent.com</span></div>`;
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
// show(el, t, start, dur, dy): fade up between start and start+dur (seconds)
function show(el, t, s, d = 0.7, dy = 24) { if (!el) return; const k = ease((t - s) / d); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * dy}px)`; }
function type(el, text, t, s, cps = 32) { const n = Math.max(0, Math.min(text.length, Math.floor((t - s) * cps))); el.textContent = text.slice(0, n); return n >= text.length; }

const SCENES = {
  // $OCULA right now: counters fill in, tile by tile
  token: { dur: 10, html: () => `<div class="stage" style="justify-content:center;padding-bottom:140px">
      <div class="nhead"><span class="chipx"><i></i>Ocula update · ${D.when}</span><span class="nca">$OCULA · ${D.oc.ca.slice(0, 6)}…${D.oc.ca.slice(-4)}</span></div>
      <h2 id="h" style="margin-top:26px">$OCULA right now. <span style="color:var(--mute)">Read by Ocula, straight from the chain.</span></h2>
      <div class="tiles">${D.oc.tiles.map((t, i) => `<div class="fade" id="t${i}"><b data-v="${t.v}" data-d="${t.d || 0}" data-p="${t.pre || ""}" data-s="${t.suf || ""}">0</b><span>${t.label}</span></div>`).join("")}</div>
      <div class="bar fade" id="bar"><div class="bt"><span>Bonding curve</span><span>${D.oc.curveETH} / ${D.oc.gradETH} ETH to graduate</span></div><div class="track2"><i id="fill"></i></div></div></div>${foot()}`,
    at(t) { show($("#h"), t, 0, .8);
      $$(".tiles>div").forEach((el, i) => { show(el, t, .8 + i * .35, .5, 14); const b = el.querySelector("b"), k = ease((t - .9 - i * .35) / 1.6); b.textContent = b.dataset.p + (Number(b.dataset.v) * k).toLocaleString("en-US", { minimumFractionDigits: +b.dataset.d, maximumFractionDigits: +b.dataset.d }) + b.dataset.s; });
      show($("#bar"), t, 3.6, .6, 10); $("#fill").style.width = D.oc.progress * ease((t - 4) / 2) + "%"; } },

  // the last 24 hours on Pons and what the newest launches look like
  radar: { dur: 11, dark: true, html: () => `<div class="stage" style="justify-content:center;padding-bottom:140px">
      <div style="display:flex;align-items:baseline;gap:30px"><div class="big" id="n" style="font-size:190px">0</div><h2 id="b">Pons launches<br><span style="color:#8d887e">in the last 24 hours.</span></h2></div>
      <p class="sub fade" id="s" style="max-width:none;margin-top:30px">Of the newest ${D.radar.n}, here is what Ocula found:</p>
      <div class="segs fade" id="sg">${D.radar.segs.map((g) => `<i class="${g.k}" style="flex:${g.v}"></i>`).join("")}</div>
      <div class="legend">${D.radar.segs.map((g, i) => `<div class="fade" id="lg${i}"><i class="${g.k}"></i><b>${g.v}</b> ${g.label}</div>`).join("")}</div></div>${foot()}`,
    at(t) { $("#n").textContent = Math.round(D.radar.total * ease(t / 2.4)).toLocaleString("en-US"); show($("#b"), t, .5, .8); show($("#s"), t, 2.6, .6);
      show($("#sg"), t, 3.2, .4, 0); $$("#sg i").forEach((x, i) => { x.style.transform = `scaleX(${ease((t - 3.4 - i * .5) / .8)})`; });
      D.radar.segs.forEach((g, i) => show($("#lg" + i), t, 3.6 + i * .5, .5, 8)); } },

  // the busiest launch where the dev already left
  trap: { dur: 12, dark: true, html: () => `<div class="stage" style="justify-content:center">
      <p class="sub fade" id="k" style="margin:0 0 10px;color:#8d887e">$${D.trap.symbol} · ${D.trap.age} after launch</p>
      <div style="display:flex;align-items:baseline;gap:28px"><div class="big" id="n" style="font-size:200px">0</div><h2 id="b">buyers.<br><span style="color:#8d887e">Looks alive.</span></h2></div>
      <ul class="reads">${D.trap.lines.map((l) => `<li class="fade"><i></i>${l}</li>`).join("")}</ul>
      <div class="stamp fade" id="v">${D.trap.verdict}</div></div>${foot()}`,
    at(t) { show($("#k"), t, 0, .6); $("#n").textContent = Math.round(D.trap.buyers * ease(t / 2.6)); show($("#b"), t, .6, .8);
      $$(".reads li").forEach((li, i) => show(li, t, 3.4 + i * 1.2, .6, 12)); show($("#v"), t, 3.4 + D.trap.lines.length * 1.2 + .3, .6, 0); } },

  // one launch that cleared every check right now
  pick: { dur: 11, html: () => `<div class="stage"><div class="split" style="grid-template-columns:1fr 1fr;gap:80px"><div>
      <span class="chipx fade" id="c"><i></i>Cleared every check · ${D.pick.age} old</span>
      <h1 id="h" style="margin-top:26px">$${D.pick.symbol}</h1><p class="sub fade" id="s">${D.pick.line}</p><p class="note2 fade" id="nf">On-chain read, not advice.</p></div>
      <ul class="ticks">${D.pick.checks.map((c) => `<li class="fade"><i>✓</i>${c}</li>`).join("")}</ul></div></div>${foot()}`,
    at(t) { show($("#c"), t, 0, .6); show($("#h"), t, .4, .8); show($("#s"), t, 1.2, .7); $$(".ticks li").forEach((li, i) => show(li, t, 2 + i * .7, .5, 10)); show($("#nf"), t, 2.4 + D.pick.checks.length * .7, .6, 0); } },

  // the burn so far (only when there has been one)
  burn: { html: () => `<div class="stage center" style="gap:24px"><span class="chipx"><i></i>Buyback &amp; burn</span><div class="big" style="font-size:180px;margin-top:20px">${D.burn.tokens}</div>
      <h2>$OCULA sent to the dead address.</h2><p class="sub" style="margin:0;max-width:none">${D.burn.line}</p></div>${foot()}` },
};

const P = new URLSearchParams(location.search), S = SCENES[P.get("s")];
document.body.classList.toggle("dark", !!S.dark); document.body.classList.toggle("still", !S.dur);
$("#root").innerHTML = S.html();
// videos run the small animations in real time; stills freeze them at a frame where each picture is complete
window.SCENE = { dur: S.dur || 0, seek(t) { S.at?.(t); document.getAnimations().forEach((a) => { a.pause(); a.currentTime = S.dur ? t * 1000 : (S.vt || 2400); }); } };
window.SCENE.seek(S.dur || 99);
</script></body></html>
